[workspace]
resolver = "2"
members = [
    "crates/boond-domain",
    "crates/boond-store",
    "crates/boond-service",
    "crates/boond-http",
    "crates/boond-server",
    "desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["XPEHO"]
rust-version = "1.85"

[workspace.dependencies]
boond-domain = { path = "crates/boond-domain" }
boond-store = { path = "crates/boond-store" }
boond-service = { path = "crates/boond-service" }
boond-http = { path = "crates/boond-http" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs"] }
rust-embed = "8"
mime_guess = "2"
urlencoding = "2"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
