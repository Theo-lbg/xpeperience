[workspace]
resolver = "2"
members = [
    "crates/xpeperience-domain",
    "crates/xpeperience-store",
    "crates/xpeperience-service",
    "crates/xpeperience-http",
    "crates/xpeperience-server",
    "desktop",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["XPEHO"]
rust-version = "1.85"

[workspace.dependencies]
xpeperience-domain = { path = "crates/xpeperience-domain" }
xpeperience-store = { path = "crates/xpeperience-store" }
xpeperience-service = { path = "crates/xpeperience-service" }
xpeperience-http = { path = "crates/xpeperience-http" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs"] }
rust-embed = "8"
mime_guess = "2"
urlencoding = "2"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
