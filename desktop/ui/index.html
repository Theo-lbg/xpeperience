<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>XpePerience</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f4f5f2; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #5b605c; }
      .box { text-align: center; max-width: 520px; padding: 24px; }
      h1 { color: #1d1f1e; font-size: 22px; margin: 0 0 8px; }
      pre { text-align: left; background: #fff; border: 1px solid #e6e8e3; border-radius: 12px; padding: 12px; white-space: pre-wrap; word-break: break-word; }
      .bar { width: 4px; height: 4px; border-radius: 50%; background: #b3d26b; margin: 18px auto 0; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1 id="title">Démarrage de XpePerience…</h1>
      <p id="text">Un instant.</p>
      <div class="bar"></div>
    </div>
    <script>
      const m = new URLSearchParams(location.search).get('error')
      if (m) {
        document.getElementById('title').textContent = 'XpePerience n’a pas pu démarrer'
        document.getElementById('text').textContent = ''
        const pre = document.createElement('pre')
        pre.textContent = m
        document.querySelector('.box').append(pre)
        document.querySelector('.bar').remove()
      }
    </script>
  </body>
</html>
