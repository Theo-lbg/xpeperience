# XpePerience — serveur d'équipe.
#
#   cp .env.example .env     # puis renseignez XPEPERIENCE_PUBLIC_URL (et lisez docs/DEPLOY.md)
#   docker compose up -d
#   docker compose logs xpeperience   # affiche le code d'installation au premier démarrage
#
# Le serveur n'écoute QUE sur 127.0.0.1 de la machine : placez devant lui un proxy HTTPS
# (Caddy fourni : docker-compose.caddy.yml, ou celui que vous utilisez déjà : Traefik, Nginx…).

name: xpeperience

services:
  xpeperience:
    # Image publiée par la release GitHub , ou construite localement avec « docker compose build ».
    image: ${XPEPERIENCE_IMAGE:-ghcr.io/theo-lbg/xpeperience:latest}
    build: .
    restart: unless-stopped
    environment:
      XPEPERIENCE_PUBLIC_URL: ${XPEPERIENCE_PUBLIC_URL:?Renseignez XPEPERIENCE_PUBLIC_URL dans .env (ex. https://xpeperience.exemple.fr)}
      XPEPERIENCE_TRUST_PROXY: "1"
      XPEPERIENCE_SETUP_CODE: ${XPEPERIENCE_SETUP_CODE:-}
      XPEPERIENCE_ALLOWED_HOSTS: ${XPEPERIENCE_ALLOWED_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - xpeperience-data:/data
    ports:
      - "127.0.0.1:${XPEPERIENCE_HOST_PORT:-8080}:8080"
    # Durcissement : aucun privilège supplémentaire, système de fichiers en lecture seule sauf /data.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  xpeperience-data:
