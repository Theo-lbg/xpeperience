# Proxy HTTPS Caddy avec certificat Let's Encrypt automatique, à ajouter au compose principal :
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Le domaine (BOOND_DOMAIN) doit pointer vers cette machine, ports 80 et 443 ouverts.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [boond]
    environment:
      BOOND_DOMAIN: ${BOOND_DOMAIN:?Renseignez BOOND_DOMAIN dans .env (ex. boond.exemple.fr)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy-data:
  caddy-config:
