name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Interface Vue (types et construction)
        run: cd web && npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Tests Rust
        run: cargo test --workspace --exclude xpeperience-desktop --locked

      - name: Clippy
        run: cargo clippy --workspace --exclude xpeperience-desktop --all-targets --locked

      - name: Extension LinkedIn (lecteur de profil)
        run: node extension/reader.test.mjs

      - name: Emballage Windows (essai avec un faux exécutable)
        run: |
          head -c 200000 /dev/urandom > "$RUNNER_TEMP/fake.exe"
          node scripts/package-windows.mjs --skip-build --exe "$RUNNER_TEMP/fake.exe"
          unzip -t dist/XpePerience-*-windows-x64.zip

  # L'application de bureau doit compiler sur chaque système livré (Windows : jamais testé à la main).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilation de l'application de bureau
        run: cargo check -p xpeperience-desktop --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construction de l'image (sans publication)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
